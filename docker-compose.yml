# Root docker-compose for running Formbricks + infrastructure locally.
# Usage: cp .env.example .env && docker compose up
services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=formbricks
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    restart: always
    image: valkey/valkey:8
    command: valkey-server --appendonly yes
    volumes:
      - redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=devminio
      - MINIO_ROOT_PASSWORD=devminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: arjenz/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  formbricks:
    restart: always
    image: ghcr.io/formbricks/formbricks:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      WEBAPP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/formbricks?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      REDIS_URL: redis://redis:6379
      EMAIL_VERIFICATION_DISABLED: 1
      PASSWORD_RESET_DISABLED: 1
      # MinIO S3-compatible storage
      S3_ACCESS_KEY: devminio
      S3_SECRET_KEY: devminio123
      S3_REGION: us-east-1
      S3_BUCKET_NAME: formbricks
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      # Mail (Mailhog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025

volumes:
  postgres:
    driver: local
  redis:
    driver: local
  minio-data:
    driver: local
